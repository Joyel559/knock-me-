org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# App version (v1.6 release prep). Bump APP_VERSION_CODE by 1 and set APP_VERSION_NAME for every
# release build; see store/release-checklist.md.
APP_VERSION_CODE=1
APP_VERSION_NAME=1.0.0

# Public, keyless, fair-use third-party servers used for search/geocoding/routing. Override these
# (and KNOCKME_CONTACT_EMAIL) if you self-host or use a paid provider — see
# store/release-checklist.md "Third-party service risk" for why the public servers are not meant
# for a large number of users.
OSRM_BASE_URL=https://router.project-osrm.org
NOMINATIM_BASE_URL=https://nominatim.openstreetmap.org
PHOTON_BASE_URL=https://photon.komoot.io
KNOCKME_CONTACT_EMAIL=contact@example.com
